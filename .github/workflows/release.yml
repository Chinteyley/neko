name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DEPLOYMENT_TARGET: '12.0'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up App Store Connect CLI
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d

      - name: Check release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION=$(xcodebuild -project neko.xcodeproj -scheme neko -showBuildSettings | awk -F ' = ' '/MARKETING_VERSION/ { print $2; exit }')
          test "$TAG_VERSION" = "v$PROJECT_VERSION"

      - name: Build universal app
        run: |
          xcodebuild -project neko.xcodeproj \
            -scheme neko \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            -arch x86_64 \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            ONLY_ACTIVE_ARCH=NO

      - name: Sign application
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/neko.app"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/neko-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          trap 'security delete-keychain "$KEYCHAIN_PATH"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH/Contents/MacOS/__preview.dylib"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH/Contents/MacOS/neko.debug.dylib"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple application
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/neko.app"
          NOTARIZATION_ARCHIVE="$RUNNER_TEMP/neko-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARIZATION_ARCHIVE"
          asc notarization submit \
            --file "$NOTARIZATION_ARCHIVE" \
            --wait \
            --timeout 30m \
            --output table
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package disk image
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/neko.app"
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/neko"
          ARCHIVE="neko-${TAG_VERSION}-macOS.dmg"
          test -d "$APP_PATH"
          lipo "$APP_EXECUTABLE" -verify_arch arm64
          lipo "$APP_EXECUTABLE" -verify_arch x86_64
          scripts/package-dmg.sh "$APP_PATH" "$ARCHIVE"

      - name: Sign, notarize, and staple disk image
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          ARCHIVE="neko-${TAG_VERSION}-macOS.dmg"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/neko-dmg-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          trap 'security delete-keychain "$KEYCHAIN_PATH"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          codesign --force --timestamp --sign "$IDENTITY" "$ARCHIVE"
          codesign --verify --verbose=2 "$ARCHIVE"
          asc notarization submit \
            --file "$ARCHIVE" \
            --wait \
            --timeout 30m \
            --output table
          xcrun stapler staple "$ARCHIVE"
          xcrun stapler validate "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_VERSION" \
            "neko-${TAG_VERSION}-macOS.dmg" \
            "neko-${TAG_VERSION}-macOS.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "$TAG_VERSION"

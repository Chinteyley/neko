name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DEPLOYMENT_TARGET: '12.0'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION=$(xcodebuild -project neko.xcodeproj -scheme neko -showBuildSettings | awk -F ' = ' '/MARKETING_VERSION/ { print $2; exit }')
          test "$TAG_VERSION" = "v$PROJECT_VERSION"

      - name: Build universal app
        run: |
          xcodebuild -project neko.xcodeproj \
            -scheme neko \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            -arch x86_64 \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package release
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/neko.app"
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/neko"
          test -d "$APP_PATH"
          lipo -verify_arch arm64 "$APP_EXECUTABLE"
          lipo -verify_arch x86_64 "$APP_EXECUTABLE"
          ARCHIVE="neko-${TAG_VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_VERSION" \
            "neko-${TAG_VERSION}-macOS.zip" \
            "neko-${TAG_VERSION}-macOS.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "$TAG_VERSION"
